# Worker 內部名稱暫時保留 box-starry，避免既有 Secrets、D1 與 YouTube 授權失效；公開品牌與正式網址已統一為 Starry Eye／繁星視界。
name = "box-starry"
main = "worker/studioRouter.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

# 正式網址
[[routes]]
pattern = "eye.starry.phd"
custom_domain = true

# 舊網址暫時保留相容，避免既有 OAuth／書籤立即失效；不再作為公開連結。
[[routes]]
pattern = "box.starry.phd"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "box-starry-db"
database_id = "ea7955f4-22fa-4435-8182-81f35c0fc4a9"
migrations_dir = "migrations"

[[d1_databases]]
binding = "STARRY_ID_DB"
database_name = "starry_id_db"
database_id = "01195c92-555e-4816-bddc-5b8cb2e795db"

[ai]
binding = "AI"

[vars]
YOUTUBE_CLIENT_ID = "798843680414-rt8bh32bbqe9tr7koi96avub347us89b.apps.googleusercontent.com"

# YOUTUBE_CLIENT_SECRET 與 YOUTUBE_TOKEN_ENCRYPTION_KEY 必須使用 Cloudflare Secrets，不能寫入 GitHub。