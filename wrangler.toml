name = "box-starry"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

# 正式部署前需在 Cloudflare 建立 box-starry-db，並將 D1 綁定為 DB。
# 同時把既有中央 Starry ID D1 綁定為 STARRY_ID_DB。
# 正式自訂網域依《Starry繁星生態系專案總覽表》規則，在確認後才加入，避免猜測網址。
