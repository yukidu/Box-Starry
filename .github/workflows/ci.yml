name: Regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: box-starry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: box-starry-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            box-starry-npm-${{ runner.os }}-
      - run: npm install --prefer-offline --ignore-scripts
      - run: npm run verify
