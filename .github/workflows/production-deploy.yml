name: Production Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: box-starry-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            box-starry-npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --prefer-offline --ignore-scripts

      - name: Verify production build
        run: npm run verify

      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply box-starry-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure YouTube runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          secret_list="$(npx wrangler secret list 2>&1)"

          if ! printf '%s' "$secret_list" | grep -q 'YOUTUBE_TOKEN_ENCRYPTION_KEY'; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put YOUTUBE_TOKEN_ENCRYPTION_KEY
          fi

          if ! printf '%s' "$secret_list" | grep -q 'YOUTUBE_CLIENT_SECRET'; then
            if [ -z "${YOUTUBE_CLIENT_SECRET:-}" ]; then
              echo 'Missing YOUTUBE_CLIENT_SECRET in Cloudflare and GitHub Secrets.'
              exit 1
            fi
            printf '%s' "$YOUTUBE_CLIENT_SECRET" | npx wrangler secret put YOUTUBE_CLIENT_SECRET
          fi

      - name: Verify official website
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://box.starry.phd/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Official website did not become reachable in time."
            exit 1
          fi

          health="$(curl -fsS --max-time 10 https://box.starry.phd/api/health)"
          printf '%s' "$health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.ok||!j.environmentReady||!j.youtubeOAuthReady){console.error(j);process.exit(1)}})"

          curl -fsS --max-time 10 https://box.starry.phd/privacy >/dev/null
          curl -fsS --max-time 10 https://box.starry.phd/terms >/dev/null

          starry_redirect="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 10 https://box.starry.phd/auth/starry)"
          printf '%s' "$starry_redirect" | grep -q '^https://id.starry.phd/auth/boxstarry$'

          curl -fsS --max-time 10 https://id.starry.phd/auth/boxstarry | grep -q 'Starry ID × 繁星膠囊'
          echo "Box Starry production health, legal pages and Starry ID entry are verified."
